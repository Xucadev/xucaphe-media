name: Voz Gemini
on:
  push:
    paths: ["tts/pedido.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tts, cancel-in-progress: false }
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tts/gemini_tts.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add tts/salida || true
          git commit -m "Audios de Gemini" || exit 0
          git pull --rebase -q origin main && git push -q origin HEAD:main
