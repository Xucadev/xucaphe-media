name: Traducir títulos (YouTube)
on:
  schedule: [{cron: "17 9 * * *"}]
  workflow_dispatch:
  push:
    paths: ["tts/traducir.py"]
permissions:
  contents: write
concurrency: { group: traducir, cancel-in-progress: false }
jobs:
  traducir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tts/traducir.py 2>&1 | tee tts/salida/traducir.log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add cola.json tts/salida/traducir.log
          git commit -m "Títulos y descripciones en inglés y portugués" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
